<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converter mobile QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: start center;
        padding: 24px;
        color: #d8d8de;
        background: #08090b;
        font: 13px/1.4 system-ui, sans-serif;
      }
      main { display: grid; gap: 10px; }
      p { margin: 0; color: #8f909a; }
      iframe {
        width: 390px;
        height: 844px;
        border: 1px solid #32333a;
        border-radius: 18px;
        background: #0c0d0f;
      }
    </style>
  </head>
  <body>
    <main>
      <p>390 × 844 mobile QA viewport</p>
      <iframe title="MP5 converter mobile QA" src="/?converter-demo=1"></iframe>
    </main>
  </body>
</html>
