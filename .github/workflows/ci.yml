name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build container package
        run: pnpm --filter @mp5/container build

      - name: Validate checked-in WASM behavior
        run: pnpm exec vitest run tests/mp5c6NativeWasmParity.test.ts tests/mp5lWasmRoundtrip.test.ts

      - name: Build WASM codecs
        run: pnpm wasm:build

      - name: Check WASM pkg is up to date
        # WASM bytes are not cross-host reproducible: Rust panic/source strings embed
        # host paths and toolchain details. Behavior is checked above before rebuild;
        # portable generated bindings must still match the fresh Linux build.
        run: |
          git diff --exit-code -- \
            apps/web/src/wasm/pkg/mp5_codec.js \
            apps/web/src/wasm/pkg/mp5_codec.d.ts \
            apps/web/src/wasm/pkg/mp5_codec_bg.wasm.d.ts \
          || {
            echo "::error::Checked-in WASM bindings differ from pnpm wasm:build. Commit regenerated apps/web/src/wasm/pkg bindings."
            git --no-pager diff --stat -- apps/web/src/wasm/pkg/
            exit 1
          }

      - name: TypeScript lint
        run: pnpm lint

      - name: Vitest (unit)
        run: pnpm test:unit

      - name: Rust codec tests
        run: cargo test -p mp5-codec --release

      - name: Validate golden fixtures
        run: pnpm fixtures:validate

  compatibility:
    name: Compatibility fixtures + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install ffmpeg (compressed source fixtures)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compatibility tests
        run: pnpm test:compatibility

  build:
    name: Production build
    needs: [lint-and-unit, compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build container package
        run: pnpm --filter @mp5/container build

      - name: Build WASM codecs
        run: pnpm wasm:build

      - name: Build web app
        run: pnpm build

  e2e:
    name: Playwright E2E
    needs: [lint-and-unit, compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build container package
        run: pnpm --filter @mp5/container build

      - name: Build WASM codecs
        run: pnpm wasm:build

      - name: Generate E2E fixtures
        run: node scripts/generate-compatibility-fixtures.mjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
